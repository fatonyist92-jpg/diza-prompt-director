name: Hunyuan Free Test

on:
  push:
    branches:
      - hunyuan-free-test
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: |
          python -m pip install --upgrade pip
          pip install -U gradio_client huggingface_hub

      - name: Generate Hunyuan I2V video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python - <<'PY'
          import os, shutil
          from gradio_client import Client, handle_file

          token = os.environ.get("HF_TOKEN") or os.environ.get("HUGGINGFACE_TOKEN") or None
          print("HF auth available:", bool(token))
          client = Client("multimodalart/Hunyuan-Video-1-5", token=token)
          img = handle_file("https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/guitar-man.png")
          prompt = "The man gently strums the red electric guitar while slightly moving his head, fixed camera, natural realistic motion."

          result = client.predict(
              img,
              prompt,
              121,
              4,
              5.0,
              1,
              1.0,
              False,
              fn_index=0,
          )
          print("RESULT:", repr(result))

          def find_path(x):
              if isinstance(x, str) and os.path.exists(x):
                  return x
              if isinstance(x, dict):
                  for k in ("path","video","value","name"):
                      v = x.get(k)
                      if isinstance(v, str) and os.path.exists(v):
                          return v
                  for v in x.values():
                      p = find_path(v)
                      if p:
                          return p
              if isinstance(x, (list, tuple)):
                  for v in x:
                      p = find_path(v)
                      if p:
                          return p
              return None

          src = find_path(result)
          if not src:
              raise RuntimeError(f"Could not locate generated video in result: {result!r}")

          shutil.copy2(src, "hunyuan_test.mp4")
          print("Saved hunyuan_test.mp4", os.path.getsize("hunyuan_test.mp4"))
          PY

      - name: Validate MP4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("hunyuan_test.mp4")
          data = p.read_bytes()
          if len(data) < 1024 or b"ftyp" not in data[:64]:
              raise SystemExit("Invalid MP4")
          print("VALID_MP4", len(data))
          PY

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: hunyuan-5s-mp4
          path: hunyuan_test.mp4
          if-no-files-found: error
          retention-days: 1
