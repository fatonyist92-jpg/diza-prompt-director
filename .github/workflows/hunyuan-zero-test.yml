name: Hunyuan Free Test

on:
  push:
    branches:
      - hunyuan-free-test
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: |
          python -m pip install --upgrade pip
          pip install -U gradio_client huggingface_hub

      - name: Generate Hunyuan video
        run: |
          python - <<'PY'
          import os, shutil, json
          from gradio_client import Client

          prompt = "A red toy car slowly drives across a wooden table, fixed camera, soft daylight, realistic motion."
          client = Client("Smart44/HunyuanVideo")

          result = client.predict(
              prompt,
              "832x624",
              65,
              -1,
              3,
              1.0,
              7.0,
              6.0,
              fn_index=0,
          )

          print("RESULT:", repr(result))

          def find_path(x):
              if isinstance(x, str) and os.path.exists(x):
                  return x
              if isinstance(x, dict):
                  for k in ("path","video","value","name"):
                      v = x.get(k)
                      if isinstance(v, str) and os.path.exists(v):
                          return v
                  for v in x.values():
                      p = find_path(v)
                      if p:
                          return p
              if isinstance(x, (list, tuple)):
                  for v in x:
                      p = find_path(v)
                      if p:
                          return p
              return None

          src = find_path(result)
          if not src:
              raise RuntimeError(f"Could not locate generated video in result: {result!r}")

          shutil.copy2(src, "hunyuan_test.mp4")
          print("Saved hunyuan_test.mp4", os.path.getsize("hunyuan_test.mp4"))
          PY

      - name: Validate MP4
        run: |
          ffprobe -v error -show_entries format=duration,size -of json hunyuan_test.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: hunyuan-test-mp4
          path: hunyuan_test.mp4
          if-no-files-found: error
          retention-days: 1
